[package]
name = "balanced-ternary"
version = "3.1.0"
edition = "2024"
rust-version = "1.85"
description = "Balanced ternary arithmetic, compact storage, and three-valued logic for no_std Rust."
authors = ["Sébastien GELDREICH <trehinos@gmail.com>"]
license = "MIT"
repository = "https://github.com/Trehinos/balanced-ternary"
readme = "README.md"
keywords = ["ternary", "balanced_ternary", "base3", "three_value_logic", "logic"]
categories = ["data-structures", "mathematics", "science", "no-std"]
autobenches = false
include = [
    "/src/**",
    "/benches/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/digit-operations.png",
    "/.changelog/**",
]

[features]
default = ["tryte", "ternary-store"]
ternary-store = ["ternary-string"]
tryte = ["ternary-string"]
ternary-string = []

[dev-dependencies]
criterion = "0.8.2"
stats_alloc = "0.1.10"

[[bench]]
name = "timings"
harness = false
required-features = ["tryte", "ternary-store"]

[[bench]]
name = "allocations"
harness = false
required-features = ["tryte", "ternary-store"]